# 상위 ReAct 에이전트 설정.
# 자세한 필드 의미는 agent/config.py 의 dataclass 를 볼 것.

gemini:
  # gemini-3.8-flash/gemini-flash-latest 는 2026-10-08 기준 504
  # DEADLINE_EXCEEDED 가 잦아 preview 모델로 바꿨다. 나중에 안정화되면
  # 다시 바꿔도 된다 — client.models.list() 로 현재 계정에서 쓸 수 있는
  # 모델 목록을 확인할 것.
  model: "gemini-3-flash-preview"
  temperature: 0.2
  max_output_tokens: 1024
  # 요청 하나가 이 시간(초)을 넘기면 타임아웃 예외를 낸다. 없으면 연결이
  # 멈췄을 때 예외 자체가 안 나서 재시도 로직이 발동하지 못하고 무한정 블로킹된다.
  request_timeout_sec: 30.0
  retry:
    # 5xx/네트워크 오류일 때만 적용(429 는 무조건 즉시 실패).
    initial_backoff_sec: 1.0
    backoff_multiplier: 2.0
    # 첫 시도부터 누적해서 이 시간(초)을 넘기면 포기하고 LLMUnavailable 로 올린다.
    max_total_wait_sec: 60.0

limits:
  # goto[...] 호출 상한. 도달하면 done[fail] 로 강제 종료한다.
  # (고정 위치 테스트용으로 1로 축소 — 로봇이 안 움직이므로 같은 장면이
  # 반복될 뿐이라 1~2스텝 이상은 의미가 없다.)
  max_goto_calls: 1
  # 전체 스텝(파싱 실패/무효 처리 포함) 상한. 도달하면 done[fail] 로 강제 종료한다.
  max_total_steps: 3

# few-shot 예시 파일. 내용이 비어 있어도 되지만 파일 자체는 있어야 한다.
fewshot_path: "prompts/react_fewshot.txt"

# 스텝별 (행동, 관측, LLM 원본 응답, 타임스탬프) JSONL 로그를 쓸 디렉터리.
log_dir: "logs/react"

# --dry-run 이 아닐 때만 쓰는 TIC-VLA 연동 설정.
ticvla:
  # scripts/ticvla_smoke_test.py 기본값 및 scripts/ticvla_bridge.py 의
  # home = Path.home() / 'TIC-VLA' 로 만들어지는 기본값과 일치(둘 다 확인됨,
  # 2026-10-26). 디스크 존재 확인 완료.
  model_path: "/home/soda/TIC-VLA/models/InternVL3-1B"
  ckpt_path: "/home/soda/TIC-VLA/checkpoints/TIC-VLA-model.ckpt"
  # predict() 에 넘길 프레임을 가져올 디렉터리. 파일명 사전순 정렬로
  # delayed/current 를 고른다 (third_party/TIC-VLA 쪽 get_numeric_key() 규칙과는
  # 무관하게 scripts/ticvla_smoke_test.select_frames() 의 단순 사전순 정렬을 쓴다).
  # ReAct run 2(2026-10-26)용 — 프레임에 실제로 보이는 물체(빨강/파랑 쿨러)가 있는
  # 낮 프레임. data/GoToColorMarker_v1/raw/ep0001_L1_red/rgb/rgb_00000.jpg 를
  # 5장(num_delayed+1) 복제한 것. run 1(암흑 대조군, "Find the cup.")은
  # logs/think_dump/static_frame 으로 이미 완료 — 그 결과는 react_20261026_010156.jsonl.
  frame_dir: "/home/soda/TIC-VLA/logs/think_dump/scene_frame"
  num_delayed: 4
